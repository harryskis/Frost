# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# NOTE: Minecraft 26.x has no Yarn mappings - the newest Yarn build in existence is
# 1.21.11+build.6, and meta.fabricmc.net reports 0 yarn builds for every 26.x version.
# The 26.x-era Fabric ecosystem (confirmed against Odin, a live Hypixel Skyblock Kotlin
# mod targeting 26.1.2) uses Mojang's official mappings instead, which is why there's no
# yarn_mappings property anymore - see build.gradle.kts's officialMojangMappings().
# Versions below match Odin 0.4.0's own 26.3 build (loader, Loom line).
minecraft_version=26.3
loader_version=0.19.5

# Mod Properties
mod_version=0.2.0
maven_group=com.frost
archives_base_name=frost

# Dependencies
fabric_version=0.165.0+26.3
fabric_kotlin_version=1.14.2+kotlin.2.4.21

# Toolchain (resolved in settings.gradle.kts)
loom_version=1.17-SNAPSHOT
kotlin_version=2.4.21

