# Builds Frost and posts it as a pre-release whenever a beta tag (like v0.4.0-beta.1) is pushed.
# The release's description comes from .github/release-notes/<tag>.md.
name: Beta release

on:
  push:
    tags:
      - "v*-beta*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: bash ./gradlew build --no-daemon

      - uses: softprops/action-gh-release@v2
        with:
          name: Frost ${{ github.ref_name }} for 26.3
          body_path: .github/release-notes/${{ github.ref_name }}.md
          prerelease: true
          files: build/libs/frost-*.jar
