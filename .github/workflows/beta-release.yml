# Posts a beta of Frost as a GitHub pre-release. Adding release notes for the version in
# gradle.properties - .github/release-notes/v<mod_version>.md - and pushing them builds Frost,
# runs its tests, and publishes the jar under the tag v<mod_version>, which GitHub creates.
# It can also be run by hand from the Actions tab.
name: Beta release

on:
  push:
    paths:
      - ".github/release-notes/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ -f ".github/release-notes/v$version.md" ]; then echo "notes=yes" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.notes == 'yes'
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.notes == 'yes'

      - name: Build and test
        if: steps.version.outputs.notes == 'yes'
        run: bash ./gradlew build --no-daemon

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.notes == 'yes'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Frost ${{ steps.version.outputs.tag }} for 26.3
          body_path: .github/release-notes/${{ steps.version.outputs.tag }}.md
          prerelease: true
          files: build/libs/frost-*.jar
